    <script>
      // Apariencia elegida en Configuración (claro/oscuro y color), antes de pintar: sin parpadeo.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('mm:tema') || 'null');
          if (p && (p.mode === 'light' || p.mode === 'dark')) {
            document.documentElement.setAttribute('data-theme', p.mode);
            var bar = p.mode === 'dark' ? '#161922' : '#ffffff';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute('data-media', m.getAttribute('media') || '');
              m.removeAttribute('media');
              m.setAttribute('content', bar);
            });
          }
          var css = localStorage.getItem('mm:tema-css');
          if (css) {
            var st = document.createElement('style');
            st.id = 'mm-acento';
            st.textContent = css;
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();

    <div id="splash" class="mm-sp" aria-hidden="true"><div class="word">Match<b>Mate</b></div></div>
    <script>
      // Una vez por sesión (al abrir la app instalada siempre es una sesión nueva); nunca más de 4 s.
      // La escena es la del último deporte usado (mm:sport); si no hay o no está activa, la genérica.
      (function () {
        var el = document.getElementById('splash');
        try {
          if (sessionStorage.getItem('mm:splash')) { el.remove(); return; }
          sessionStorage.setItem('mm:splash', '1');
        } catch (e) {}
        var scenes = {"bowling":"bowling","padel":"padel","tennis":"tennis","pickleball":"pickleball","basketball":"basketball","football":"football","futsal":"football","golf":"golf","swimming":"swimming"};
        var scene = 'generic';
        try {
          var sport = localStorage.getItem('mm:sport');
          if (sport && Object.prototype.hasOwnProperty.call(scenes, sport)) scene = scenes[sport];
        } catch (e) {}
        var t = document.getElementById('sp-' + scene);
        if (t) el.insertBefore(t.content.cloneNode(true), el.firstChild);
        el.setAttribute('data-scene', scene);
        setTimeout(function () { if (el.isConnected) { el.classList.add('out'); setTimeout(function () { el.remove(); }, 400); } }, 4000);
      })();
    </script>
